# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  repository_dispatch:
    types: [backend_automation]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"

  crawl_javdb:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Screenshot javdb.com
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({
              viewport: { width: 1365, height: 768 },
              userAgent: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36'
            });

            await page.goto('https://javdb573.com', {
              waitUntil: 'domcontentloaded',
              timeout: 60000
            });

            await page.waitForTimeout(20000);
            console.log('URL:', page.url());
            console.log('Title:', await page.title());
            await page.screenshot({ path: 'javdb.png', fullPage: true });
            await browser.close();
          })();
          EOF

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: javdb-screenshot
          path: javdb.png
  
  dl: 
    runs-on: ubuntu-latest
    env: 
      seed: "${{ github.event.client_payload.seed || 'magnet:?xt=urn:btih:d984f67af9917b214cd8b6048ab5624c7df6a07a&tr=https%3A%2F%2Facademictorrents.com%2Fannounce.php&tr=udp%3A%2F%2Ftracker.coppersurfer.tk%3A6969&tr=udp%3A%2F%2Ftracker.opentrackr.org%3A1337%2Fannounce'}} "
    steps:
      - uses: derekn/s5cmd-action@latest
        with:
          version: 2.1.0-beta.1
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-docker-images: 'true'
          remove-codeql: 'true'

      - name: Init
        run: |
          echo ${{secrets.INIT}} | base64 -d > init.cred
          echo ${{secrets.OUTPUT}} | base64 -d > output.cred
          # s5cmd --credentials-file init.cred --endpoint-url ${{ secrets.S3_ENDPOINT_URL }} ls s3://aria-config
          s5cmd --credentials-file init.cred --endpoint-url ${{ secrets.S3_ENDPOINT_URL }} cp s3://aria-config/dht.dat .

      - name:  Install package
        run: sudo snap install aria2c
        
      # Runs a set of commands using the runners shell
      - name: show Aria2c info
        run: |
          aria2c -v

      - run: echo "seed:" "${{ env.seed }}"
      - name: dl
        run: |
          aria2c  --seed-time=0 -c --dht-file-path=dht.dat "${{ env.seed }}"

      # - name: rename to upper case
      #  run: |
      #    for f in * ; do mv -- "$f" "$(tr [:lower:] [:upper:] <<< "$f")" ; done
          
      - name: Upload file to bucket
        if: success()
        run: |
          s5cmd --credentials-file init.cred --endpoint-url ${{ secrets.S3_ENDPOINT_URL }} cp dht.dat s3://aria-config/dht.dat 
          # s5cmd --credentials-file output.cred --endpoint-url ${{ secrets.S3_ENDPOINT_URL }} cp --exclude "dht.dat"  --exclude "*.cred" "*" s3://aria-output
          s5cmd --credentials-file output.cred --endpoint-url ${{ secrets.S3_ENDPOINT_URL }} cp --exclude "dht.dat"  --exclude "*.cred" --exclude "三 上 悠 亚 想 要 跟 你 决 胜 负.mp4" --exclude  "台 妹 子 線 上 現 場 直 播 各 式 花 式 表 演.mp4" --exclude  "社 區 最 新 情 報.mp4" --exclude "苍 老 师 强 力 推 荐.mp4" --exclude "18+游戏大全(996gg.cc)-七龍珠H版-三國志H版-三國群淫傳等.mp4" --exclude "*.html" --exclude "*.gif" --exclude "*.url" --exclude "*.txt" "*" s3://aria-output
